# ESP32 Glove Configuration
# Configuration for ESP32-based pneumatic glove control system

# Network settings
ip_address: "192.168.50.11" # ESP32 IP address (Arlen hotspot)
port: 4210 # TCP port for communication
timeout: 10 # Connection timeout in seconds (increased for stability)

# Control settings
enabled: true # Enable/disable ESP32 control
gesture_hold_time: 0.5 # Minimum time between gesture changes (seconds) - increased for stability
connection_mode: "persistent" # Connection mode: "persistent" (maintain constant connection) or "reconnect" (reconnect as needed)
heartbeat_interval: 10.0 # Send heartbeat every N seconds to keep connection alive (increased for stability)

# Default pressure settings (0-100)
default_pressure:
  flexion: 85 # Default flexion pressure (increased for more visible movement)
  extension: 70 # Default extension pressure (increased for more visible movement)

# Default speed setting (0-4)
default_speed: 4 # Default speed level (0=Stop, 1=Slow, 2=Medium, 3=Fast, 4=Fastest) - set to max for testing

# Gesture mapping from EMG predictions to ESP32 gestures
# This maps the output classes from your trained models to ESP32 gesture IDs
# Mapping follows Unity VR OpenLoopConfig.json gesture definitions

# Open/Close task mapping (graspIDOpenClose: [0, 1])
gesture_mapping_open_close:
  0: 2 # HandOpen -> ESP32 Extend (case 2: "222220")
  1: 1 # HandClose -> ESP32 All Flex (case 1: "111110")

# Grasp Patterns task mapping (graspIDGraspPatterns: [0, 2, 3, 4])
gesture_mapping_grasp_patterns:
  0: 0 # HandOpen -> ESP32 Relax/Open
  2: 3 # HookGrasp -> ESP32 2-Finger Pinch
  3: 4 # LateralGrasp -> ESP32 3-Finger Pinch
  4: 8 # IndexPointing -> ESP32 Index Pointing

# Single Fingers task mapping (graspIDSingleFingers: [0, 5, 6, 7])
gesture_mapping_single_fingers:
  0: 0 # HandOpen -> ESP32 Relax/Open
  5: 5 # ThumbFlexion -> ESP32 Thumb
  6: 6 # IndexFlexion -> ESP32 Index
  7: 7 # MRPFlexion -> ESP32 Middle

# Default gesture mapping (updated to match ESP32 cases)
gesture_mapping:
  0: 2 # Hand Open -> ESP32 Extend (case 2)
  1: 1 # Fist -> ESP32 All Flex (case 1)
  3: 4 # LateralGrasp -> ESP32 3-Finger Pinch (case 4)
  4: 8 # IndexPointing -> ESP32 Index Pointing (case 8)
  5: 5 # ThumbFlexion -> ESP32 Thumb (case 5)
  6: 6 # IndexFlexion -> ESP32 Index (case 6)
  7: 7 # MRPFlexion -> ESP32 MRP Flex (case 7)

# Auto-discovery settings
auto_discovery:
  enabled: false # Enable automatic ESP32 discovery
  ip_range: "192.168.1.1-254" # IP range to scan
  scan_timeout: 1 # Timeout per IP during scan

# Debug settings
debug:
  log_commands: true # Log all commands sent to ESP32
  log_responses: true # Log all responses from ESP32
